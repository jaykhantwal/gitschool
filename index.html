<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b3a6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tug of War: Mathematics</title>
<style>
  :root{
    --blue:#1f6fe0; --blue-d:#154fa6; --blue-l:#d9e8ff;
    --red:#e23b3b;  --red-d:#a82525;  --red-l:#ffdede;
    --ink:#12233d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(#cfe9ff,#eaf6ff);overflow:hidden}
  #app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .title{font-weight:900;font-size:clamp(16px,2.6vw,34px);letter-spacing:.5px;line-height:1}
  .title small{display:block;font-weight:700;font-size:.52em;opacity:.6;letter-spacing:2px;margin-top:3px}
  .site{background:#15386f;color:#fff;border:3px solid #ffd23f;border-radius:999px;padding:6px 22px;font-weight:900;font-size:clamp(16px,2.6vw,34px);letter-spacing:.5px;white-space:nowrap;box-shadow:0 4px 12px #0002}
  .timer{background:#fff;border-radius:14px;padding:2px 18px;font-weight:900;font-size:clamp(18px,2.6vw,34px);box-shadow:0 4px 12px #0003;min-width:96px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink)}
  .timer.low{color:var(--red);animation:pulse .6s infinite alternate}
  @keyframes pulse{to{transform:scale(1.08)}}
  .tools{display:flex;gap:8px}
  .tools button{border:0;background:#fff;border-radius:14px;padding:8px 16px;font-size:clamp(16px,2vw,26px);cursor:pointer;box-shadow:0 3px 8px #0002;min-height:44px}
  .tools button:active{transform:scale(.94)}

  /* ---------- board ---------- */
  .board{display:grid;grid-template-columns:minmax(220px,22%) minmax(0,1fr) minmax(220px,22%);gap:12px;min-height:0}
  .panel{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto 1fr;min-width:0;gap:8px;border-radius:22px;padding:10px;min-height:0;box-shadow:0 8px 22px #0003;transition:transform .15s}
  .panel.blue{background:linear-gradient(var(--b1,#d6e6ff),var(--b2,#a9c9ff));border:3px solid var(--blue)}
  .panel.red{background:linear-gradient(var(--r1,#ffdcdc),var(--r2,#ffb4b4));border:3px solid var(--red)}
  .sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:2px solid #0003}
  .panel header{display:flex;align-items:center;justify-content:space-between;border-radius:14px;padding:6px 14px;color:#fff;font-weight:900;font-size:clamp(17px,2.3vw,30px)}
  .blue header{background:linear-gradient(var(--blue),var(--blue-d))} .red header{background:linear-gradient(var(--red),var(--red-d))}
  .score{background:#fff;color:var(--ink);border-radius:50%;min-width:1.7em;height:1.7em;display:grid;place-items:center;font-size:.85em}
  .qbox{background:#fff;border-radius:16px;text-align:center;padding:10px 4px;font-weight:900;font-size:clamp(24px,3.3vw,60px);font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:inset 0 -4px 0 #0001}
  .ans{background:#fff;border:3px solid #0003;border-radius:14px;text-align:center;font-weight:900;font-size:clamp(24px,3.6vw,50px);min-height:1.5em;line-height:1.5em;font-variant-numeric:tabular-nums}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;min-height:0}
  .pad button{border:0;border-radius:16px;font-weight:900;font-size:clamp(22px,3.2vw,44px);color:var(--ink);background:#fff;box-shadow:0 5px 0 #0003;cursor:pointer;min-height:50px;font-family:inherit}
  .pad button:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}
  .pad button[data-k=ok]{color:#fff}
  .blue .pad button[data-k=ok]{background:var(--blue)} .red .pad button[data-k=ok]{background:var(--red)}
  .pad button[data-k=back]{background:#ffe9a8}
  .panel.good{animation:good .4s} .panel.bad{animation:bad .4s}
  @keyframes good{40%{transform:scale(1.03);box-shadow:0 0 0 8px #2ecc71aa}}
  @keyframes bad{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  .panel.bad .ans{background:#ffd0d0}

  /* ---------- arena ---------- */
  .arena{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 8px 22px #0003;border:4px solid #fff;background:#9fd8ff;min-height:0}
  .arena svg{width:100%;height:100%;display:block}
  .banner{position:absolute;left:0;right:0;top:10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 14px;pointer-events:none}
  .banner .b{justify-self:start} .banner .r{justify-self:end}
  .banner span{font-weight:900;font-size:clamp(14px,2vw,28px);color:#fff;padding:4px 18px;border-radius:999px;box-shadow:0 3px 8px #0003}
  .banner .b{background:var(--blue)} .banner .r{background:var(--red)}

  #caption{position:absolute;left:50%;bottom:12px;z-index:2;width:max-content;max-width:92%;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#fff;border:3px solid #ffd23f;border-radius:18px;padding:6px 18px;font-weight:900;font-size:clamp(13px,1.8vw,24px);text-align:center;box-shadow:0 5px 14px #0004;transition:opacity .25s,transform .25s}
  #caption.show{opacity:1;transform:translate(-50%,0)}
  /* characters: --c = team colour, --c2 = trim colour (set by script) */
  .kid .skin{fill:var(--skin)} .kid .kit{fill:var(--c)} .kid .shorts{fill:var(--sh)}
  .kid .trim{stroke:var(--c2)} .kid .stripe{stroke:var(--c);fill:none}
  .cloud{animation:drift 70s linear infinite}
  .cloud.c2{animation-duration:95s;animation-delay:-40s}
  @keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(160px)}}

  /* ---------- overlay ---------- */
  #overlay{position:fixed;inset:0;background:#0b1b33cc;display:grid;place-items:center;z-index:10;padding:14px}
  #overlay.hidden{display:none}
  #overlay.result{background:transparent;place-items:end center;align-content:end;padding:8px 8px max(12px,env(safe-area-inset-bottom));pointer-events:none}
  #overlay.result .card{pointer-events:auto;padding:10px 22px 16px;width:min(560px,96vw);background:#fffffff2;border:4px solid #ffd23f;box-shadow:0 10px 30px #0005;animation:drop .5s cubic-bezier(.3,1.5,.5,1)}
  .result h1{font-size:clamp(20px,3vw,34px)}
  .result .stats{margin:4px 0 10px;gap:18px}
  .result .big{font-size:clamp(17px,2vw,24px);padding:10px 26px}
  @keyframes drop{from{transform:translateY(120%)}to{transform:none}}
  @media (min-width:901px) and (min-aspect-ratio:1/1){ #overlay.result .card{width:min(520px,52vw)} }
  @media (max-width:900px) and (orientation:portrait){ #overlay.result{place-items:end center;align-content:end;padding-bottom:max(14px,env(safe-area-inset-bottom))} }
  @media (max-height:500px){ #overlay.result{place-items:end center;align-content:end} .result .stats{display:none} #overlay.result .card{padding:6px 14px 12px} .result .big{padding:6px 18px} }
  .card{background:#fff;border-radius:26px;padding:clamp(16px,3vw,34px);width:min(700px,96vw);max-height:96dvh;overflow:auto;box-shadow:0 20px 60px #0008;text-align:center}
  .card h1{margin:0 0 4px;font-size:clamp(24px,4vw,44px)}
  .card p.sub{margin:0 0 16px;opacity:.7}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;text-align:left}
  .row label{font-weight:700;font-size:14px;display:block}
  .row input[type=text],.row select{width:100%;margin-top:4px;padding:12px;border-radius:12px;border:2px solid #cfd8e6;font-size:17px;font-family:inherit;user-select:text;-webkit-user-select:text;background:#fff}
  .ops{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 14px}
  .ops label{border:2px solid #cfd8e6;border-radius:14px;padding:10px 16px;font-weight:800;font-size:19px;cursor:pointer}
  .ops input{display:none}
  .ops label:has(input:checked){background:#1f6fe0;border-color:#1f6fe0;color:#fff}
  .big{border:0;border-radius:18px;background:linear-gradient(#1f6fe0,#154fa6);color:#fff;font-weight:900;font-size:clamp(18px,2.6vw,30px);padding:14px 40px;cursor:pointer;box-shadow:0 6px 0 #0a2f6b;font-family:inherit}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #0a2f6b}
  .big.alt{background:linear-gradient(#8a98ad,#68768c);box-shadow:0 6px 0 #44505f;margin-left:8px}
  .count{font-size:clamp(90px,20vw,220px);font-weight:900;color:#fff;text-shadow:0 8px 30px #000a}
  .trophy{font-size:clamp(50px,10vw,100px)}
  .stats{display:flex;justify-content:center;gap:24px;margin:10px 0 18px;font-weight:800;flex-wrap:wrap}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
  .confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{top:108%}}

  /* ---------- phones / portrait ---------- */
  @media (max-width:900px), (max-aspect-ratio:1/1){
    html,body{overflow:auto}
    #app{height:auto;min-height:100dvh}
    .board{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
    .arena{grid-column:1 / -1;grid-row:1;height:52vw;min-height:230px;max-height:46dvh}
    .panel{grid-row:2}
    .pad button{min-height:58px}
    .tools button{padding:8px 12px}
    .site{padding:3px 12px;border-width:2px}
    .timer{padding:1px 10px;min-width:78px}
    .banner>span{padding:4px 10px}
  }
  @media (max-width:900px), (max-aspect-ratio:1/1){
    #caption{bottom:4px;font-size:11px;padding:2px 10px;border-width:2px;max-width:96%}
  }
</style>
</head>

<div id="overlay"></div>

<script>
(() => {
  "use strict";

  /* ================= state ================= */
  const MAX_SHIFT = 135;                 // px (in scene units) the rope can travel from centre
  const cfg = {
    names: ["Blue", "Red"],
    colors: ["blue", "red"],
    ops: ["+", "-"],
    level: "easy",
    style: "normal",
    time: 90,
    steps: 5
  };
  const S = { pos: 0, running: false, time: 0, timerId: null, teams: [] };

  /* ================= team colours ================= */
  // main/dark = panel + banner colours; kids = [kurta, pattern] for the back and front kid
  const PALETTE = {
    blue:   { label: "Blue",   main: "#1f6fe0", dark: "#154fa6", kids: [["#1f5fd0", "#9fc4ff"], ["#2a73ee", "#c2dcff"]] },
    red:    { label: "Red",    main: "#e23b3b", dark: "#a82525", kids: [["#d42a2a", "#ffb3a8"], ["#ec4545", "#ffd0c8"]] },
    green:  { label: "Green",  main: "#1fa84f", dark: "#12753a", kids: [["#168a40", "#b6f0c8"], ["#27b95e", "#d6f8e0"]] },
    yellow: { label: "Yellow", main: "#f2b807", dark: "#b58600", kids: [["#e0a800", "#fff0b0"], ["#f7c92a", "#fff8d6"]] },
    orange: { label: "Orange", main: "#f08a1f", dark: "#b35d05", kids: [["#dd7a10", "#ffd9a8"], ["#f79a3a", "#ffe8cb"]] },
    purple: { label: "Purple", main: "#8a45d6", dark: "#5e2a9a", kids: [["#7a38c4", "#dcc2ff"], ["#9a5be0", "#ebdcff"]] },
    pink:   { label: "Pink",   main: "#e8479c", dark: "#a8266f", kids: [["#d63a8c", "#ffc2e0"], ["#f060ae", "#ffd9ec"]] },
    teal:   { label: "Teal",   main: "#14a3a3", dark: "#0b7070", kids: [["#0e8f8f", "#b0f0f0"], ["#22b8b8", "#d0f8f8"]] }
  };
  const mix = (hex, amt) => {
    const n = parseInt(hex.slice(1), 16), f = v => Math.round(v + (255 - v) * amt);
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  };
  function applyColors() {
    const root = document.documentElement.style;
    [0, 1].forEach(i => {
      const p = PALETTE[cfg.colors[i]], k = i === 0 ? "b" : "r", v = i === 0 ? "blue" : "red";
      root.setProperty(`--${v}`, p.main);
      root.setProperty(`--${v}-d`, p.dark);
      root.setProperty(`--${k}1`, mix(p.main, .82));
      root.setProperty(`--${k}2`, mix(p.main, .6));
      document.querySelectorAll(`.kid.t${i}`).forEach(g => {
        g.style.setProperty("--c", p.kids[1][0]);
        g.style.setProperty("--c2", "#ffffff");
        g.style.setProperty("--sh", p.dark);
      });
      $(`#zone${i}`).setAttribute("fill", p.main);
      $(`#win${i}`).setAttribute("stroke", p.main);
    });
  }

  const $ = (s, r = document) => r.querySelector(s);
  const overlay = $("#overlay");
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  /* ================= sound ================= */
  let audioCtx = null, soundOn = true;
  function beep(freq, dur = .12, type = "sine", vol = .15, when = 0) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + when;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  const sndGood = () => { beep(660, .1); beep(880, .15, "sine", .15, .09); };
  const sndBad  = () => beep(150, .3, "sawtooth", .12);
  const sndTick = () => beep(520, .08, "square", .06);
  const sndWin  = () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .25, "triangle", .18, i * .15));

  /* ================= children cheering (made in the browser, no audio file needed) ================= */
  let cheerOut = null, partyTimer = null, resultTimer = null;
  function buildCheer(ctx, out) {
    const t0 = ctx.currentTime + .02, R = (a, b) => a + Math.random() * (b - a);
    // many young voices shouting "yaaay!" in three waves
    [0, 1.9, 3.9].forEach(wave => {
      for (let v = 0; v < 11; v++) {
        const t = t0 + wave + R(0, .45), dur = R(.9, 1.6), pitch = R(330, 560);
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sawtooth";
        o.frequency.setValueAtTime(pitch * .8, t);
        o.frequency.exponentialRampToValueAtTime(pitch * R(1.15, 1.35), t + .18);
        o.frequency.exponentialRampToValueAtTime(pitch * R(.9, 1.05), t + dur);
        const lfo = ctx.createOscillator(), depth = ctx.createGain();
        lfo.frequency.value = R(5, 8); depth.gain.value = pitch * .025;
        lfo.connect(depth); depth.connect(o.frequency);
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(R(.05, .09), t + .09);
        g.gain.setTargetAtTime(.0001, t + dur * .6, dur * .14);
        // two vowel resonances, gliding from "ya" to "ay"
        [[R(850, 1050), R(600, 750), 5], [R(1700, 2000), R(2500, 2900), 8]].forEach(([from, to, q]) => {
          const f = ctx.createBiquadFilter();
          f.type = "bandpass"; f.Q.value = q;
          f.frequency.setValueAtTime(from, t);
          f.frequency.linearRampToValueAtTime(to, t + dur * .7);
          o.connect(f); f.connect(g);
        });
        g.connect(out);
        o.start(t); lfo.start(t); o.stop(t + dur + .3); lfo.stop(t + dur + .3);
      }
    });
  }
  function playCheer() {
    stopCheer();
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      cheerOut = audioCtx.createGain();
      cheerOut.gain.value = 9;
      const limit = audioCtx.createDynamicsCompressor();
      limit.threshold.value = -14; limit.knee.value = 8; limit.ratio.value = 14;
      limit.attack.value = .003; limit.release.value = .2;
      cheerOut.connect(limit); limit.connect(audioCtx.destination);
      buildCheer(audioCtx, cheerOut);
    } catch (e) {}
  }
  function stopCheer() { if (cheerOut) { cheerOut.disconnect(); cheerOut = null; } }
  function stopCelebration() {
    stopCheer();
    stopCrowd();
    hush();
    clearInterval(partyTimer);
    clearTimeout(resultTimer);
    document.querySelectorAll(".confetti").forEach(n => n.remove());
    overlay.classList.remove("result");
  }

  /* ================= spoken encouragement (device voice + on-screen caption) ================= */
  const synth = window.speechSynthesis || null;
  let captionTimer = null, voiceName = "";
  try { voiceName = localStorage.getItem("tow-voice") || ""; } catch (e) {}
  // the most human-sounding voices first: "Natural"/neural ones, then online Google voices, Indian accent preferred
  function voiceScore(v) {
    return (/natural|neural|premium|enhanced/i.test(v.name) ? 8 : 0) + (/google/i.test(v.name) ? 4 : 0) +
      (/[-_]IN/i.test(v.lang) ? 3 : 0) + (v.localService ? 0 : 1) - (/espeak|compact/i.test(v.name) ? 6 : 0);
  }
  function voiceList() {
    if (!synth) return [];
    return synth.getVoices().filter(v => /^en/i.test(v.lang)).sort((a, b) => voiceScore(b) - voiceScore(a));
  }
  function chooseVoice() {
    const all = voiceList();
    return all.find(v => v.name === voiceName) || all[0] || null;
  }
  function speak(text) {
    if (!soundOn || !synth) return;
    try {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text), v = chooseVoice();
      if (v) u.voice = v;
      u.lang = v ? v.lang : "en-IN";
      u.rate = 1; u.pitch = 1; u.volume = 1;             // plain, natural speaking voice
      u.onstart = () => { crowdLevel(.35); if (cheerOut) cheerOut.gain.value = 3; };   // keep the voice clear above the crowd
      u.onend = u.onerror = () => { crowdLevel(1); if (cheerOut) cheerOut.gain.value = 9; };
      synth.speak(u);
    } catch (e) {}
  }
  // the only two spoken lines in the game: "Let's go!" after the countdown, and the winner announcement
  function say(text) {
    const box = $("#caption");
    box.textContent = text;
    box.classList.add("show");
    clearTimeout(captionTimer);
    captionTimer = setTimeout(() => box.classList.remove("show"), 3200);
    speak(text);
  }
  function hush() {
    clearTimeout(captionTimer);
    $("#caption").classList.remove("show");
    try { if (synth) synth.cancel(); } catch (e) {}
    crowdLevel(1);
  }
  // "Tilak" is called "Team Tilak"; a name that already says team ("Team A") is left as it is
  const team = i => /team/i.test(cfg.names[i]) ? cfg.names[i] : "Team " + cfg.names[i];

  /* ================= stadium crowd of children, playing softly all through the match ================= */
  // To use a real recording, keep a file called crowd.mp3 in the same folder as this page.
  const CROWD_VOL = 2.2;
  let crowdBuf = null, crowdSrc = null, crowdGain = null, crowdOn = false;
  const recording = new Audio("crowd.mp3");
  recording.loop = true;
  let hasRecording = false;
  recording.addEventListener("canplaythrough", () => { hasRecording = true; });

  async function makeCrowd() {
    const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const sr = 22050, len = 10, fade = 1, ctx = new Off(1, sr * (len + fade), sr);
    const R = (a, b) => a + Math.random() * (b - a);
    // many children cheering "yaaay" together: long, soft, overlapping voices
    for (let v = 0; v < 46; v++) {
      const dur = R(1.3, 2.7), t = R(0, len + fade - dur - .1), pitch = R(270, 470);
      const o = ctx.createOscillator(), g = ctx.createGain(), soft = ctx.createBiquadFilter();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(pitch * .85, t);
      o.frequency.exponentialRampToValueAtTime(pitch * R(1.12, 1.28), t + .25);
      o.frequency.exponentialRampToValueAtTime(pitch * R(.92, 1.04), t + dur);
      const lfo = ctx.createOscillator(), depth = ctx.createGain();
      lfo.frequency.value = R(4.5, 7); depth.gain.value = pitch * .02;
      lfo.connect(depth); depth.connect(o.frequency);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(R(.035, .075), t + .18);
      g.gain.setTargetAtTime(.0001, t + dur * .55, dur * .16);
      soft.type = "lowpass"; soft.frequency.value = 3200; soft.Q.value = .4;
      // two vowel resonances, gliding from "ya" to "ay"
      [[R(800, 1000), R(600, 750), 3.5], [R(1700, 2000), R(2400, 2700), 5]].forEach(([from, to, q]) => {
        const f = ctx.createBiquadFilter();
        f.type = "bandpass"; f.Q.value = q;
        f.frequency.setValueAtTime(from, t);
        f.frequency.linearRampToValueAtTime(to, t + dur * .7);
        o.connect(f); f.connect(g);
      });
      g.connect(soft); soft.connect(ctx.destination);
      o.start(t); lfo.start(t); o.stop(t + dur + .4); lfo.stop(t + dur + .4);
    }
    const full = (await ctx.startRendering()).getChannelData(0);
    // blend the tail into the start so the loop has no gap
    const out = new Float32Array(sr * len);
    out.set(full.subarray(0, sr * len));
    for (let i = 0; i < sr * fade; i++) { const k = i / (sr * fade); out[i] = out[i] * Math.sqrt(k) + full[sr * len + i] * Math.sqrt(1 - k); }
    return { data: out, rate: sr };
  }
  const crowdReady = makeCrowd().catch(() => null);

  async function startCrowd() {
    stopCrowd();
    crowdOn = true;
    if (!soundOn) return;
    if (hasRecording) { recording.volume = .5; recording.currentTime = 0; recording.play().catch(() => {}); return; }
    const made = await crowdReady;
    if (!made || !crowdOn || !soundOn || crowdSrc) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!crowdBuf) { crowdBuf = audioCtx.createBuffer(1, made.data.length, made.rate); crowdBuf.getChannelData(0).set(made.data); }
      crowdSrc = audioCtx.createBufferSource();
      crowdSrc.buffer = crowdBuf; crowdSrc.loop = true;
      crowdGain = audioCtx.createGain();
      crowdGain.gain.value = CROWD_VOL;
      crowdSrc.connect(crowdGain); crowdGain.connect(audioCtx.destination);
      crowdSrc.start();
    } catch (e) {}
  }
  function stopCrowd() {
    crowdOn = false;
    recording.pause();
    if (crowdSrc) { try { crowdSrc.stop(); } catch (e) {} crowdSrc.disconnect(); crowdGain.disconnect(); crowdSrc = null; }
  }
  function crowdLevel(k) {
    if (hasRecording) recording.volume = Math.min(1, .5 * k);
    if (crowdSrc) crowdGain.gain.setTargetAtTime(CROWD_VOL * k, audioCtx.currentTime, .15);
  }
  function crowdSwell() {                        // the crowd roars after a good answer
    if (!crowdSrc) return;
    const g = crowdGain.gain, t = audioCtx.currentTime;
    g.cancelScheduledValues(t);
    g.setTargetAtTime(CROWD_VOL * 2.4, t, .1);
    g.setTargetAtTime(CROWD_VOL, t + 1.2, .4);
  }
  function crowdClaps() {                        // clap, clap, clap-clap-clap
    [0, .4, .8, 1, 1.2].forEach(w => { beep(1100, .04, "square", .07, w); beep(1700, .03, "triangle", .1, w); });
  }

  /* ================= panels ================= */
  const KEYS = ["7","8","9","4","5","6","1","2","3","back","0","ok"];
  const LABEL = { back: "⌫", ok: "✔" };

  function buildPanel(i) {
    const el = document.createElement("section");
    el.className = "panel " + (i === 0 ? "blue" : "red");
    el.id = "panel" + i;
    el.innerHTML = `
      <header><span class="tname"></span><span class="score">0</span></header>
      <div class="qbox">–</div>
      <div class="ans">&nbsp;</div>
      <div class="pad">${KEYS.map(k => `<button data-k="${k}">${LABEL[k] || k}</button>`).join("")}</div>`;
    $("#panel" + i).replaceWith(el);
    $(".pad", el).addEventListener("pointerdown", e => {
      const b = e.target.closest("button");
      if (!b) return;
      e.preventDefault();
      press(i, b.dataset.k);
    });
  }

  /* ================= questions ================= */
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const LEVEL = {
    easy:   { add: 10, mul: 5 },
    medium: { add: 20, mul: 10 },
    hard:   { add: 50, mul: 12 }
  };
  function makeQuestion() {
    const L = LEVEL[cfg.level];
    const op = cfg.ops[rnd(0, cfg.ops.length - 1)];
    let a, b, r, sym;
    if (op === "+")      { a = rnd(1, L.add); b = rnd(1, L.add); r = a + b; sym = "+"; }
    else if (op === "-") { a = rnd(2, L.add); b = rnd(1, a - 1); r = a - b; sym = "−"; }
    else if (op === "x") { a = rnd(2, L.mul); b = rnd(2, L.mul); r = a * b; sym = "×"; }
    else                 { b = rnd(2, L.mul); r = rnd(2, L.mul); a = b * r; sym = "÷"; }
    const hide = cfg.style === "missing" || (cfg.style === "mixed" && Math.random() < .4);
    return hide ? { text: `${a} ${sym} ? = ${r}`, ans: b }
                : { text: `${a} ${sym} ${b} = ?`, ans: r };
  }

  /* ================= characters (jointed rig, drawn every frame) ================= */
  const NS = "http://www.w3.org/2000/svg";
  const K = 1.68, GROUND = 362;                      // kid scale and ground line in scene units
  const f1 = v => Math.round(v * 10) / 10;
  const P = p => f1(p[0]) + " " + f1(p[1]);
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixP = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];

  function node(parent, tag, attrs) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent.appendChild(n);
    return n;
  }
  const set = (n, d) => n.setAttribute("d", d);

  // two-bone joint: where the knee / elbow goes
  function joint(a, b, l1, l2, dir) {
    let dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || .01;
    const ux = dx / d, uy = dy / d;
    d = Math.min(d, l1 + l2 - .01);
    const x = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(l1 * l1 - x * x, 0));
    return [a[0] + ux * x + uy * h * dir, a[1] + uy * x - ux * h * dir];
  }
  // smooth tapered limb segment from a (radius r1) to b (radius r2)
  function taper(a, b, r1, r2, bulge = 0) {
    const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d;
    const at = (p, r, s) => [p[0] + nx * r * s, p[1] + ny * r * s];
    const m = mixP(a, b, .4), mr = lerp(r1, r2, .4) + bulge;
    return `M${P(at(a, r1, 1))} Q${P(at(m, mr, 1))} ${P(at(b, r2, 1))} A${f1(r2)} ${f1(r2)} 0 0 0 ${P(at(b, r2, -1))}` +
           ` Q${P(at(m, mr, -1))} ${P(at(a, r1, -1))} A${f1(r1)} ${f1(r1)} 0 0 0 ${P(at(a, r1, 1))}Z`;
  }

  const HAIR = [
    // short spiky
    "M-17 4 C-22 -6 -19 -17 -10 -20 L-11 -25 L-3 -21 L0 -27 L5 -21 L12 -25 L12 -19 L19 -19 L16 -14 C18 -12 18 -9 17 -6 L11 -11 L9 -7 L4 -12 L0 -8 L-4 -11 C-6 -7 -7 -3 -7 1 L-10 -1 C-12 2 -12 7 -11 10 C-14 9 -16 7 -17 4Z",
    // side swept
    "M-16 7 C-23 -8 -15 -23 1 -22 C10 -25 21 -19 20 -9 C21 -7 20 -5 18 -4 C16 -10 11 -12 6 -12 C9 -11 9 -9 8 -8 C2 -13 -4 -11 -6 -7 C-8 -4 -7 0 -8 2 L-11 -1 C-13 3 -11 8 -11 11 C-13 11 -15 9 -16 7Z"
  ];

  function buildLeg(g) {
    const o = { thigh: node(g, "path", { class: "skin" }), shin: node(g, "path", { class: "skin" }),
      sock: node(g, "path", { fill: "#fff", stroke: "#c3ccd8", "stroke-width": .7 }),
      s1: node(g, "path", { class: "stripe", "stroke-width": 2.4 }), s2: node(g, "path", { class: "stripe", "stroke-width": 1.4 }) };
    o.shoe = node(g, "g", {});
    node(o.shoe, "path", { d: "M-8.5 -5 C-5 -8 0 -8 2 -6 L8 -2 C14 -1 18 1 18 5 L-9 5 C-11 1 -10.5 -2 -8.5 -5Z", class: "kit", stroke: "#0004", "stroke-width": .8 });
    node(o.shoe, "path", { d: "M-9.5 4 L18 4 C19 7 17 9 14 9 L-7 9 C-10 9 -10.5 6 -9.5 4Z", fill: "#fff", stroke: "#8d97a5", "stroke-width": .8 });
    node(o.shoe, "path", { d: "M-8 7 L16 7", stroke: "#2b3040", "stroke-width": 1.2, fill: "none" });
    node(o.shoe, "path", { d: "M-1 -5 L5 -4 M1 -2.6 L7 -1.4", stroke: "#fff", "stroke-width": 1.5, "stroke-linecap": "round", fill: "none" });
    node(o.shoe, "path", { d: "M-6 2 Q2 3 9 -1", class: "trim", "stroke-width": 2, "stroke-linecap": "round", fill: "none" });
    o.short = node(g, "path", { class: "shorts" });
    o.piping = node(g, "path", { class: "stripe", "stroke-width": 2 });
    return o;
  }
  function drawLeg(o, hip, foot, tilt) {
    const knee = joint(hip, foot, 37, 37, 1);
    set(o.thigh, taper(hip, knee, 9, 5.8, .6));
    set(o.shin, taper(knee, foot, 5.6, 3.8, 1.4));
    const top = mixP(knee, foot, .17);                       // sock reaches just below the knee
    set(o.sock, taper(top, foot, 6.4, 4.4, 1));
    const dx = foot[0] - knee[0], dy = foot[1] - knee[1], d = Math.hypot(dx, dy), n = [-dy / d * 6.2, dx / d * 6.2];
    [[o.s1, .24], [o.s2, .33]].forEach(([s, t]) => {
      const c = mixP(knee, foot, t);
      set(s, `M${P([c[0] + n[0], c[1] + n[1]])} L${P([c[0] - n[0], c[1] - n[1]])}`);
    });
    o.shoe.setAttribute("transform", `translate(${P(foot)}) rotate(${f1(tilt)})`);
    const hem = mixP(hip, knee, .66);
    set(o.short, taper(hip, hem, 11.5, 8.6, .8));
    set(o.piping, `M${P(hip)} L${P(mixP(hip, knee, .66))}`);
  }

  function buildArm(g) {
    return { up: node(g, "path", { class: "skin" }), fore: node(g, "path", { class: "skin" }),
      sleeve: node(g, "path", { class: "kit" }), cuff: node(g, "path", { class: "stripe", "stroke-width": 2.6 }),
      hand: node(g, "g", {}) };
  }
  function buildFist(a) {
    node(a.hand, "path", { d: "M-5.5 -5 C-1 -8 6 -6.500 6.500 -2 C7.500 3 4 7 -1 6.500 C-5 6 -7 3 -6.500 -1Z", class: "skin" });
    node(a.hand, "path", { d: "M-1.500 -4.500 Q1 -1 -.5 5.500 M2.500 -4 Q5 0 3.500 4.500", fill: "none", stroke: "#8a5230", "stroke-width": .9, "stroke-linecap": "round", opacity: .8 });
  }
  function drawArm(a, sh, hand, dir) {
    const el = joint(sh, hand, 27, 27, dir);
    set(a.up, taper(sh, el, 5.600, 4.200, .5));
    set(a.fore, taper(el, hand, 4.400, 3.200, .8));
    const end = mixP(sh, el, .68);
    set(a.sleeve, taper(sh, end, 7.800, 5.900, .4));
    const dx = el[0] - sh[0], dy = el[1] - sh[1], d = Math.hypot(dx, dy), n = [-dy / d * 5.600, dx / d * 5.600];
    set(a.cuff, `M${P([end[0] + n[0], end[1] + n[1]])} L${P([end[0] - n[0], end[1] - n[1]])}`);
    a.hand.setAttribute("transform", `translate(${P(hand)})`);
  }

  function buildKid(team, x, hairStyle, skin, hair, number, phase) {
    const side = team === 0 ? 1 : -1;
    const mk = layer => {
      const g = node($(layer), "g", { class: "kid t" + team });
      g.style.setProperty("--skin", skin);
      return g;
    };
    const bodyRoot = mk("#bodies"), frontRoot = mk("#arms");
    const k = { team, side, x, phase };
    k.shadow = node(bodyRoot, "ellipse", { cx: 0, cy: 2, rx: 50, ry: 6, fill: "#0003" });
    const body = node(bodyRoot, "g", {}), front = node(frontRoot, "g", {});   // lifted when jumping
    const farG = node(body, "g", {});
    k.farArm = buildArm(farG); buildFist(k.farArm);
    k.farLeg = buildLeg(farG);
    farG.style.filter = "brightness(.82)";
    k.nearLeg = buildLeg(node(body, "g", {}));
    k.hips = node(body, "path", { class: "shorts" });

    k.torso = node(body, "g", {});                    // origin = hip, y up is negative
    node(k.torso, "path", { d: "M-4 -50 L5 -50 L5 -38 L-4 -38Z", class: "skin" });
    node(k.torso, "path", { d: "M-12 2 C-14 -14 -15 -30 -14 -38 C-12 -45 -7 -47 -4 -47 L7 -47 C13 -45 16 -40 15 -32 C13 -20 11 -10 12 2 C4 6 -5 6 -12 2Z", class: "kit" });
    node(k.torso, "path", { d: "M-12 2 C-14 -14 -15 -30 -14 -38 C-13 -42 -10 -45 -7 -46 C-8 -30 -5 -12 -4 4.500 C-7 4.500 -10 3.500 -12 2Z", fill: "#000", opacity: .14 });
    node(k.torso, "path", { d: "M-4 -47 Q1.500 -39 7 -47", class: "trim", fill: "none", "stroke-width": 3.200 });
    node(k.torso, "path", { d: "M-13.600 -29 Q0 -24 14 -30", class: "trim", fill: "none", "stroke-width": 3.500 });
    const num = node(k.torso, "text", { x: 0, y: -3, "text-anchor": "middle", "font-size": 11, "font-weight": 900, fill: "#fff", transform: side < 0 ? "scale(-1,1)" : "" });
    num.textContent = number;
    node(k.torso, "path", { d: "M-12 -1 Q0 3 12 -1", stroke: "#fff", "stroke-width": 1.600, fill: "none", opacity: .7 });

    k.head = node(body, "g", {});                     // origin = middle of the head
    node(k.head, "path", { d: "M-15 -4 C-15 -16 -4 -20 5 -18 C14 -16 17 -9 17 -2 C17 1 21 4 20 6 C19 8 17 7 16.500 9 C16 15 11 19 4 18.500 C-5 18 -14 10 -15 -4Z", class: "skin" });
    node(k.head, "path", { d: HAIR[hairStyle], fill: hair });
    node(k.head, "path", { d: hairStyle ? "M-12 -12 Q-3 -21 12 -18 M-14 -5 Q-10 -15 0 -17" : "M-12 -12 L-7 -18 M-3 -15 L1 -20 M7 -16 L11 -20", fill: "none", stroke: "#fff", "stroke-width": 1, "stroke-linecap": "round", opacity: .22 });
    node(k.head, "path", { d: "M-8 0 C-13 -2 -14 6 -9 8 C-7 9 -5 8 -5 6Z", class: "skin", stroke: "#9b6038", "stroke-width": .8 });
    node(k.head, "path", { d: "M-9.500 2 Q-7 3 -8 6", stroke: "#9b6038", "stroke-width": .9, fill: "none" });
    [2.500, 12.500].forEach(ex => {
      node(k.head, "ellipse", { cx: ex, cy: 0, rx: 3, ry: 3.400, fill: "#fff" });
      node(k.head, "ellipse", { cx: ex + .8, cy: .3, rx: 2, ry: 2.500, fill: "#3a2314" });
      node(k.head, "circle", { cx: ex + 1.500, cy: -.8, r: .8, fill: "#fff" });
    });
    k.brows = node(k.head, "path", { fill: "none", stroke: hair, "stroke-width": 1.900, "stroke-linecap": "round" });
    node(k.head, "path", { d: "M17.500 2 Q20 6 16.500 6.500", fill: "none", stroke: "#a4673f", "stroke-width": 1, "stroke-linecap": "round" });
    node(k.head, "ellipse", { cx: 4, cy: 7.500, rx: 3.800, ry: 2.400, fill: "#ff6f61", opacity: .28 });
    k.mouth = node(k.head, "path", { stroke: "#7a2a22", "stroke-width": 1.300, "stroke-linejoin": "round", "stroke-linecap": "round" });

    k.nearArm = buildArm(front); buildFist(k.nearArm);
    k.roots = [bodyRoot, frontRoot];
    k.lift = [body, front];
    return k;
  }

  const MOUTH = {
    effort: ["M7 10.500 Q11 9 15 10 Q12 14.500 7 10.500Z", "#fff", "M0 -6.500 L5.500 -4.500 M10 -4.500 L15.500 -6.500"],
    happy:  ["M6 9 Q11 8.500 15.500 9 Q12 17.500 6 9Z", "#8e2b25", "M0 -6 Q3 -8.500 5.500 -6.500 M10 -6.500 Q13 -8.500 15.500 -6"],
    sad:    ["M7 13 Q11 9 15 12.500", "none", "M0 -5 L5.500 -7 M10 -7 L15.500 -5"]
  };

  /* one frame of one kid. returns the two hand positions in scene units */
  function poseKid(k, t, shift, moving) {
    const a = anim[k.team], el = t - a.start, wave = Math.sin(t * 3.600 + k.phase);
    const heave = reduceMotion ? 0 : wave;
    let hip = [-13 - heave * 2.500, -66 + heave * 1.200], lean = -17 - heave * 3.500, headTilt = 6, mood = "effort";
    let near = [31 - heave * 2, -83], far = [17 - heave * 2, -83], jumpY = 0, free = 0;
    let bf = [-37, -9], ff = [25, -9];

    const kick = el < .6 ? Math.sin(Math.PI * el / .6) : 0;
    if (a.type === "lunge")   { lean -= 14 * kick; hip[0] -= 9 * kick; hip[1] += 4 * kick; near[0] -= 14 * kick; far[0] -= 14 * kick; }
    if (a.type === "stumble") { lean += 22 * kick; hip[0] += 9 * kick; near[0] += 7 * kick; far[0] += 7 * kick; }

    if (moving > .02 && !a.over) {                    // small steps while the rope slides
      const s = Math.sin(t * 17 + k.phase * 2), m = Math.min(moving, 1);
      bf = [bf[0], -9 - Math.max(0, s) * 9 * m];
      ff = [ff[0], -9 - Math.max(0, -s) * 9 * m];
    }
    if (a.over) {                                     // game finished: blend into the final pose
      const e = Math.min(el / .5, 1), s = e * e * (3 - 2 * e);
      free = s;
      if (a.type === "win") {
        const hop = Math.abs(Math.sin(el * 5.500 + k.phase));
        jumpY = -hop * 20 * s; mood = "happy";
        lean = lerp(lean, -2, s); hip = mixP(hip, [0, -76 + (1 - hop) * 7], s); headTilt = lerp(6, -4, s);
        near = mixP(near, [46, -141], s); far = mixP(far, [-46, -140], s);
        bf = mixP(bf, [-17, -9 - hop * 5], s); ff = mixP(ff, [17, -9 - hop * 5], s);
      } else if (a.type === "lose") {
        mood = "sad";
        lean = lerp(lean, 27, s); hip = mixP(hip, [-8, -48], s); headTilt = lerp(6, 16, s);
        near = mixP(near, [27, -43], s); far = mixP(far, [20, -45], s);
      }
    }

    const r = lean * Math.PI / 180, sin = Math.sin(r), cos = Math.cos(r);
    const spine = (x, y) => [hip[0] + x * cos - y * sin, hip[1] + x * sin + y * cos];
    drawLeg(k.farLeg, [hip[0] - 3, hip[1]], [bf[0], bf[1]], bf[1] < -9 ? 14 : 0);
    drawLeg(k.nearLeg, [hip[0] + 4, hip[1] + 1], [ff[0], ff[1]], ff[1] < -9 ? -10 : -7 * (1 - free));
    set(k.hips, `M${P(spine(-12.500, -5))} L${P(spine(12.500, -5))} L${P(spine(13, 7))} Q${P(spine(0, 15))} ${P(spine(-13, 7))}Z`);
    k.torso.setAttribute("transform", `translate(${P(hip)}) rotate(${f1(lean)})`);
    k.head.setAttribute("transform", `translate(${P(spine(3, -63))}) rotate(${f1(lean * .3 + headTilt)})`);
    if (k.mood !== mood) {
      k.mood = mood;
      set(k.mouth, MOUTH[mood][0]); k.mouth.setAttribute("fill", MOUTH[mood][1]); set(k.brows, MOUTH[mood][2]);
    }
    const raised = a.type === "win" && a.over && free > .6;
    drawArm(k.farArm, spine(-3, -39), far, raised ? 1 : -1);
    drawArm(k.nearArm, spine(1, -38), near, -1);

    const X = k.x + shift;
    k.shadow.setAttribute("cx", f1(hip[0] * .4));
    const tf = `translate(${f1(X)} ${GROUND}) scale(${k.side * K} ${K})`;
    k.shadow.setAttribute("rx", f1(50 + jumpY * .6));
    k.roots.forEach(g => g.setAttribute("transform", tf));
    k.lift.forEach(g => g.setAttribute("transform", `translate(0 ${f1(jumpY)})`));
    const world = p => [X + k.side * K * p[0], GROUND + K * (p[1] + jumpY)];
    return { near: world(near), far: world(far), free };
  }

  /* ================= rope + animation loop ================= */
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const anim = [{ type: "idle", start: 0, over: false }, { type: "idle", start: 0, over: false }];
  const now = () => performance.now() / 1000;
  function setAnim(team, type, over = false) { anim[team] = { type, start: now(), over }; }
  function clearCharacters() { setAnim(0, "idle"); setAnim(1, "idle"); }

  let kids = [], shiftNow = 0, shiftVel = 0, shiftTarget = 0, lastT = 0;
  function buildKids() {
    kids = [
      buildKid(0, 122, 1, "#c98b5a", "#1d1310", 7, 0),     // blue, back
      buildKid(0, 258, 0, "#e0a876", "#2a1a10", 10, .5),   // blue, front
      buildKid(1, 678, 0, "#d29765", "#17100d", 5, .2),    // red, back
      buildKid(1, 542, 1, "#eab487", "#3a2415", 9, .7)     // red, front
    ];
  }

  function drawRope(h, t) {
    const [bb, bf, rb, rf] = h;
    const d = Math.max(...h.map(x => x.free));            // 0 = held tight, 1 = dropped on the grass
    const drop = (p, i) => mixP(p, [p[0], GROUND - 1 + (i % 2) * 4], d);
    const pts = [bb.far, bb.near, bf.far, bf.near, rf.near, rf.far, rb.near, rb.far].map(drop);
    const sway = reduceMotion ? 0 : Math.sin(t * 2.200) * 3;

    // short loose tail behind each last player: over the hip, down, and resting on the grass
    const tail = (p, s) => {
      const a = [p[0] - s * 58, lerp(p[1] + 8, GROUND - 1, d)];
      const g = [p[0] - s * (92 + sway), GROUND + 1];
      const e = [g[0] - s * 30, GROUND + 4];
      return { a, g, e, c1: [p[0] - s * 28, p[1] - 1], c2: [a[0] - s * 26, lerp(a[1] + 22, GROUND, d)] };
    };
    const L = tail(pts[0], 1), R = tail(pts[7], -1);
    const mid = (pts[3][0] + pts[4][0]) / 2;
    const sag = lerp(7 + (reduceMotion ? 0 : Math.sin(t * 3.600) * 3), 2, d);
    const midY = lerp((pts[3][1] + pts[4][1]) / 2 + sag, GROUND + 2, d);

    const path = `M${P(L.e)} Q${P([L.g[0] - 14, GROUND - 3])} ${P(L.g)} C${P([L.g[0] + 16, GROUND + 4])} ${P(L.c2)} ${P(L.a)}` +
      ` Q${P(L.c1)} ${P(pts[0])} L${P(pts[1])} L${P(pts[2])} L${P(pts[3])}` +
      ` Q${P([mid, 2 * midY - (pts[3][1] + pts[4][1]) / 2])} ${P(pts[4])}` +
      ` L${P(pts[5])} L${P(pts[6])} L${P(pts[7])} Q${P(R.c1)} ${P(R.a)} C${P(R.c2)} ${P([R.g[0] - 16, GROUND + 4])} ${P(R.g)}` +
      ` Q${P([R.g[0] + 14, GROUND - 3])} ${P(R.e)}`;
    ["#ropeEdge", "#ropeCore", "#ropeTwist", "#ropeShine"].forEach(id => set($(id), path));
    [[L, 1], [R, -1]].forEach(([T, s], i) => {
      set($("#fray" + i), `M${P(T.e)} l${-9 * s} -4 M${P(T.e)} l${-11 * s} 0 M${P(T.e)} l${-9 * s} 4`);
      $("#knot" + i).setAttribute("cx", f1(T.e[0]));
      $("#knot" + i).setAttribute("cy", f1(T.e[1]));
    });
    const flutter = reduceMotion ? 0 : Math.sin(t * 5) * 3 + shiftVel * -.04;
    $("#flag").setAttribute("transform", `translate(${f1(mid)} ${f1(midY)})`);
    set($("#cloth"), `M-6 2 Q${f1(-8 + flutter * .5)} 16 ${f1(-10 + flutter)} 32 L${f1(flutter)} 26 L${f1(9 + flutter)} 33 Q${f1(8 + flutter * .5)} 16 6 2Z`);
  }

  function frame() {
    const t = now(), dt = Math.min(t - lastT, .05);
    lastT = t;
    // soft spring so the whole rope slides smoothly with a tiny natural overshoot
    for (let i = 0; i < 4; i++) {
      shiftVel += ((shiftTarget - shiftNow) * 55 - shiftVel * 11) * dt / 4;
      shiftNow += shiftVel * dt / 4;
    }
    const moving = reduceMotion ? 0 : Math.abs(shiftVel) / 45;
    [0, 1].forEach(i => { if (!anim[i].over && anim[i].type !== "idle" && t - anim[i].start > .6) anim[i].type = "idle"; });
    drawRope(kids.map(k => poseKid(k, t, shiftNow, moving)), t);
    requestAnimationFrame(frame);
  }

  function confetti() {
    const box = document.createElement("div");
    box.className = "confetti";
    const cols = ["#ffd23f", "#ff5d5d", "#3fa7ff", "#5be37d", "#ff8bd1"];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "%";
      p.style.background = cols[i % cols.length];
      p.style.animationDuration = (2 + Math.random() * 2.5) + "s";
      p.style.animationDelay = (Math.random() * .8) + "s";
      p.style.transform = `rotate(${Math.random() * 360}deg)`;
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 5500);
  }

  /* ================= game flow ================= */
  function resetTeams() {
    S.teams = [0, 1].map(() => ({ input: "", q: null, score: 0 }));
    S.pos = 0;
    clearCharacters();
    renderRope();
    [0, 1].forEach(i => {
      const el = $("#panel" + i);
      $(".tname", el).textContent = cfg.names[i];
      $(".score", el).textContent = "0";
      $(".qbox", el).textContent = "–";
      $(".ans", el).innerHTML = "&nbsp;";
    });
    $("#bn0").textContent = "◀ " + cfg.names[0];
    $("#bn1").textContent = cfg.names[1] + " ▶";
  }

  function newQ(i) {
    const t = S.teams[i];
    t.q = makeQuestion();
    t.input = "";
    const el = $("#panel" + i);
    $(".qbox", el).textContent = t.q.text;
    $(".ans", el).innerHTML = "&nbsp;";
  }

  function press(i, k) {
    if (!S.running) return;
    const t = S.teams[i], el = $("#panel" + i);
    if (k === "ok") { submit(i); return; }
    if (k === "back") t.input = t.input.slice(0, -1);
    else if (t.input.length < 4) t.input += k;
    $(".ans", el).textContent = t.input || " ";
    beep(400 + (Number(k) || 0) * 25, .04, "sine", .05);
  }

  function flash(el, cls) {
    el.classList.remove("good", "bad");
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function submit(i) {
    const t = S.teams[i], el = $("#panel" + i);
    if (t.input === "") return;
    if (Number(t.input) === t.q.ans) {
      t.score++;
      $(".score", el).textContent = t.score;
      S.pos += (i === 0 ? -1 : 1);
      renderRope();
      setAnim(i, "lunge");
      setAnim(1 - i, "stumble");
      flash(el, "good"); sndGood();
      newQ(i);
      if (Math.abs(S.pos) >= cfg.steps) endGame();
      else crowdSwell();
    } else {
      flash(el, "bad"); sndBad();
      t.input = "";
      $(".ans", el).innerHTML = "&nbsp;";
    }
  }

  function renderRope() {
    shiftTarget = S.pos * (MAX_SHIFT / cfg.steps);
  }

  const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");

  function startCountdown() {
    try { if (synth && soundOn) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u); } } catch (e) {}
    stopCelebration();
    resetTeams();
    $("#timer").textContent = cfg.time ? fmt(cfg.time) : "∞";
    $("#timer").classList.remove("low");
    let n = 3;
    overlay.classList.remove("hidden");
    const tick = () => {
      overlay.innerHTML = `<div class="count">${n > 0 ? n : "GO!"}</div>`;
      if (n === 0) say("Let's go!");
      n > 0 ? sndTick() : beep(880, .3, "square", .1);
      if (n-- < 0) { overlay.classList.add("hidden"); beginPlay(); return; }
      setTimeout(tick, n < 0 ? 600 : 800);
    };
    tick();
  }

  function beginPlay() {
    S.running = true;
    S.time = cfg.time;
    newQ(0); newQ(1);
    startCrowd();
    clearInterval(S.timerId);
    if (cfg.time === 0) return;          // unlimited: only the rope decides the winner
    S.timerId = setInterval(() => {
      S.time--;
      $("#timer").textContent = fmt(Math.max(S.time, 0));
      if (S.time <= 10) $("#timer").classList.add("low");
      if (S.time <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    if (!S.running) return;
    S.running = false;
    clearInterval(S.timerId);
    hush();
    stopCrowd();
    const w = S.pos < 0 ? 0 : S.pos > 0 ? 1 : -1;
    if (w >= 0) {
      setAnim(w, "win", true);
      setAnim(1 - w, "lose", true);
      confetti();
      let bursts = 0;
      partyTimer = setInterval(() => { confetti(); if (++bursts >= 5) clearInterval(partyTimer); }, 2400);
      playCheer();
    }
    sndWin();
    say(w < 0 ? "It's a draw!" : `${team(w)} wins!`);
    const title = w === -1 ? "It's a draw!" : `${cfg.names[w]} team wins!`;
    resultTimer = setTimeout(() => {
      overlay.classList.remove("hidden");
      overlay.classList.add("result");
      overlay.innerHTML = `
        <div class="card">
          <h1>${w === -1 ? "🤝" : "🏆"} ${esc(title)}</h1>
          <div class="stats">
            <span style="color:var(--blue-d)">${esc(cfg.names[0])}: ${S.teams[0].score} correct</span>
            <span style="color:var(--red-d)">${esc(cfg.names[1])}: ${S.teams[1].score} correct</span>
            <span style="color:#15386f">🌐 gitschool.in</span>
          </div>
          <button class="big" id="again">Play again</button>
          <button class="big alt" id="toMenu">Settings</button>
        </div>`;
      $("#again").onclick = startCountdown;
      $("#toMenu").onclick = showMenu;
    }, w === -1 ? 800 : 2500);
  }

  /* ================= menu ================= */
  function showMenu() {
    stopCelebration();
    S.running = false;
    clearInterval(S.timerId);
    overlay.classList.remove("hidden");
    overlay.innerHTML = `
      <div class="card">
        <h1>Tug of War: Mathematics</h1>
        <p class="sub">Two teams, one screen. Answer correctly to pull the rope!</p>
        <div class="row">
          <label>Left team name<input type="text" id="n0" maxlength="14" value="${esc(cfg.names[0])}"></label>
          <label>Right team name<input type="text" id="n1" maxlength="14" value="${esc(cfg.names[1])}"></label>
        </div>
        <div class="row">
          ${[0, 1].map(i => `<label><span class="sw" id="sw${i}"></span>${i ? "Right" : "Left"} team colour
            <select id="c${i}">${Object.entries(PALETTE).map(([k, p]) => `<option value="${k}">${p.label}</option>`).join("")}</select></label>`).join("")}
        </div>
        <div class="ops">
          ${[["+","＋ Add"],["-","− Subtract"],["x","× Multiply"],["/","÷ Divide"]].map(([v,l]) =>
            `<label><input type="checkbox" value="${v}" ${cfg.ops.includes(v) ? "checked" : ""}><span>${l}</span></label>`).join("")}
        </div>
        <div class="row">
          <label>Level
            <select id="level"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>
          </label>
          <label>Question style
            <select id="style"><option value="normal">Normal (3 + 2 = ?)</option><option value="missing">Missing number (3 + ? = 5)</option><option value="mixed">Mixed</option></select>
          </label>
        </div>
        <div class="row">
          <label>Time
            <select id="time"><option value="0">Unlimited ∞</option><option value="60">1 minute</option><option value="90">1 min 30 sec</option><option value="120">2 minutes</option><option value="180">3 minutes</option></select>
          </label>
          <label>Correct answers needed to win
            <select id="steps"><option value="3">3</option><option value="5">5</option><option value="7">7</option><option value="10">10</option></select>
          </label>
        </div>
        <div class="row" style="grid-template-columns:1fr auto;align-items:end">
          <label>Announcer voice<select id="voice"></select></label>
          <button type="button" id="testVoice" style="padding:12px 16px;border-radius:12px;border:2px solid #cfd8e6;background:#fff;font-weight:800;font-size:16px;cursor:pointer">🔈 Test</button>
        </div>
        <button class="big" id="go">▶ Start</button>
      </div>`;
    fillVoices();
    $("#voice").onchange = e => { voiceName = e.target.value; try { localStorage.setItem("tow-voice", voiceName); } catch (x) {} };
    $("#testVoice").onclick = () => { const n = $("#n0").value.trim() || "Blue"; speak(`${/team/i.test(n) ? n : "Team " + n} wins!`); };
    $("#level").value = cfg.level;
    $("#style").value = cfg.style;
    $("#time").value = String(cfg.time);
    $("#steps").value = String(cfg.steps);

    // colour dropdowns: live preview, no duplicate colours, name follows colour if left unchanged
    [0, 1].forEach(i => { $("#c" + i).value = cfg.colors[i]; });
    const syncColors = () => {
      [0, 1].forEach(i => {
        const other = $("#c" + (1 - i)).value;
        [...$("#c" + i).options].forEach(o => { o.disabled = o.value === other; });
        $("#sw" + i).style.background = PALETTE[$("#c" + i).value].main;
      });
      cfg.colors = [$("#c0").value, $("#c1").value];
      applyColors();
    };
    [0, 1].forEach(i => {
      let prev = $("#c" + i).value;
      $("#c" + i).onchange = () => {
        const nameBox = $("#n" + i), now = $("#c" + i).value;
        if (nameBox.value.trim() === PALETTE[prev].label) nameBox.value = PALETTE[now].label;
        prev = now;
        syncColors();
      };
    });
    syncColors();

    $("#go").onclick = () => {
      const ops = [...overlay.querySelectorAll(".ops input:checked")].map(x => x.value);
      if (!ops.length) { alert("Please choose at least one operation."); return; }
      cfg.ops = ops;
      cfg.colors = [$("#c0").value, $("#c1").value];
      cfg.names = [$("#n0").value.trim() || PALETTE[cfg.colors[0]].label, $("#n1").value.trim() || PALETTE[cfg.colors[1]].label];
      applyColors();
      cfg.level = $("#level").value;
      cfg.style = $("#style").value;
      cfg.time = Number($("#time").value);
      cfg.steps = Number($("#steps").value);
      startCountdown();
    };
  }

  function fillVoices() {
    const box = document.getElementById("voice");
    if (!box) return;
    box.innerHTML = `<option value="">Automatic (best available)</option>` +
      voiceList().map(v => `<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join("");
    box.value = voiceName;
    if (box.selectedIndex < 0) box.value = "";
  }
  if (synth && synth.addEventListener) synth.addEventListener("voiceschanged", fillVoices);

  /* ================= top bar buttons ================= */
  $("#btnMenu").onclick = showMenu;
  $("#btnSound").onclick = e => { soundOn = !soundOn; if (!soundOn) { stopCheer(); stopCrowd(); try { if (synth) synth.cancel(); } catch (x) {} }
    else if (S.running) startCrowd(); e.currentTarget.textContent = soundOn ? "🔊" : "🔇"; };
  $("#btnFull").onclick = () => {
    const d = document, el = d.documentElement;
    if (!d.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); }
    else { (d.exitFullscreen || d.webkitExitFullscreen || (() => {})).call(d); }
  };
  document.addEventListener("contextmenu", e => e.preventDefault());

  /* ================= init ================= */
  buildPanel(0); buildPanel(1);
  buildKids();
  applyColors();
  resetTeams();
  window.__cheer = buildCheer;
  showMenu();
  lastT = now();
  frame();
})();
</script>
</body>
</html>
